services:
  postgres:
    image: postgres:16-alpine
    container_name: review_queue_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: review_queue
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d review_queue"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 2s

  app:
    build: .
    container_name: review_queue_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: review_queue
      LEASE_DURATION_SECONDS: 8.0
      HEARTBEAT_INTERVAL_SECONDS: 2.5
      SWEEPER_INTERVAL_SECONDS: 1.0
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
